<!DOCTYPE html>
<html>
<head>
    <title>Test CSV Upload</title>
</head>
<body>
    <h1>Test CSV Upload</h1>
    <button onclick="testUpload()">Test Upload 3 Products</button>
    <div id="result"></div>

    <script>
        async function testUpload() {
            const testProducts = [
                {
                    Handle: 'test-product-1',
                    Title: 'Test Product 1',
                    'Body (HTML)': 'This is a test product description',
                    Vendor: 'Test Brand',
                    Type: 'Electronics',
                    'Variant Price': 999,
                    'Variant Compare At Price': 1299,
                    'Variant Grams': 500,
                    'Image Src 1': 'https://via.placeholder.com/300x300?text=Product1',
                    Published: 'TRUE'
                },
                {
                    Handle: 'test-product-2',
                    Title: 'Test Product 2',
                    'Body (HTML)': 'Another test product',
                    Vendor: 'Test Brand 2',
                    Type: 'Home',
                    'Variant Price': 1999,
                    'Variant Compare At Price': 2499,
                    'Variant Grams': 750,
                    'Image Src 1': 'https://via.placeholder.com/300x300?text=Product2',
                    Published: 'TRUE'
                },
                {
                    Handle: 'test-product-3',
                    Title: 'Test Product 3',
                    'Body (HTML)': 'Third test product',
                    Vendor: 'Test Brand 3',
                    Type: 'Sports',
                    'Variant Price': 599,
                    'Variant Compare At Price': 799,
                    'Variant Grams': 300,
                    'Image Src 1': 'https://via.placeholder.com/300x300?text=Product3',
                    Published: 'TRUE'
                }
            ];

            try {
                document.getElementById('result').innerHTML = 'Uploading...';
                
                const response = await fetch('/api/vendor/import-csv', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        vendorId: 1,
                        products: testProducts
                    })
                });
                
                const result = await response.json();
                document.getElementById('result').innerHTML = `
                    <h3>Result:</h3>
                    <pre>${JSON.stringify(result, null, 2)}</pre>
                `;
                
                if (result.success) {
                    alert(`Success! ${result.processed || result.inserted} products uploaded!`);
                } else {
                    alert(`Failed: ${result.message}`);
                }
            } catch (error) {
                document.getElementById('result').innerHTML = `Error: ${error.message}`;
                alert(`Error: ${error.message}`);
            }
        }
    </script>
</body>
</html>
