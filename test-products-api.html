<!DOCTYPE html>
<html>
<head>
    <title>Test Products API</title>
</head>
<body>
    <h1>Test Products API</h1>
    <button onclick="testProductsAPI()">Test Products API</button>
    <div id="result"></div>

    <script>
        async function testProductsAPI() {
            try {
                document.getElementById('result').innerHTML = 'Loading...';
                
                const response = await fetch('/api/products');
                const products = await response.json();
                
                document.getElementById('result').innerHTML = `
                    <h3>Products API Result:</h3>
                    <p>Total products: ${products.length}</p>
                    <p>Database products: ${products.filter(p => p.isVendorProduct).length}</p>
                    <p>JSON products: ${products.filter(p => !p.isVendorProduct).length}</p>
                    <h4>First 5 products:</h4>
                    <pre>${JSON.stringify(products.slice(0, 5), null, 2)}</pre>
                `;
                
            } catch (error) {
                document.getElementById('result').innerHTML = `Error: ${error.message}`;
            }
        }
    </script>
</body>
</html>
